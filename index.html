<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a2130" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ConfidantPM" />
    <!-- Static, app-wide: nothing sets these per route (no Helmet, no SSR),
         so they describe the public marketing page at "/" - the only route a
         crawler can actually reach. Copy is the approved hero headline and
         subheadline from Marketing.jsx; keep the three in sync by hand. -->
    <meta
      name="description"
      content="ConfidantPM's assistant reads your documents, asks the right questions, and never moves without your sign-off. Built for Waterfall, Agile, and Hybrid teams — it adapts to how you already work."
    />
    <title>ConfidantPM — Project management that actually knows your project.</title>

    <!-- Static like everything else in this <head>: every route is served the
         same index.html (see vercel.json's catch-all rewrite), so /login,
         /dashboard and /admin ship this canonical too. That is the intent -
         it points every duplicate of the marketing HTML back at "/" so a
         crawler consolidates them instead of indexing an app route. -->
    <link rel="canonical" href="https://confidantpm.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ConfidantPM" />
    <meta property="og:url" content="https://confidantpm.com/" />
    <meta
      property="og:title"
      content="Project management that actually knows your project."
    />
    <meta
      property="og:description"
      content="ConfidantPM's assistant reads your documents, asks the right questions, and never moves without your sign-off. Built for Waterfall, Agile, and Hybrid teams — it adapts to how you already work."
    />
    <meta property="og:image" content="https://confidantpm.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ConfidantPM — Project management that actually knows your project."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://confidantpm.com/og-image.png"
    />
    <meta
      name="twitter:title"
      content="Project management that actually knows your project."
    />
    <meta
      name="twitter:description"
      content="ConfidantPM's assistant reads your documents, asks the right questions, and never moves without your sign-off. Built for Waterfall, Agile, and Hybrid teams — it adapts to how you already work."
    />
    <!-- Static like the rest of this <head>, and for the same reason: "/" is
         the only route a crawler reaches, so this describes the marketing
         page. description is kept byte-identical to the meta description and
         og:description above - keep all three in sync by hand.
         No "offers" node on purpose: pricing is not finalized, and a guessed
         price in structured data is worse than an absent one. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "ConfidantPM",
            "description": "ConfidantPM's assistant reads your documents, asks the right questions, and never moves without your sign-off. Built for Waterfall, Agile, and Hybrid teams — it adapts to how you already work.",
            "url": "https://confidantpm.com/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web"
          },
          {
            "@type": "Organization",
            "name": "ConfidantPM",
            "url": "https://confidantpm.com/",
            "logo": "https://confidantpm.com/icon-512.png"
          }
        ]
      }
    </script>

    <script>
      document.documentElement.setAttribute('data-theme', 'dark')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
